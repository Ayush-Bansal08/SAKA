        model:
          description: "OPTIONAL: canonical id (or alias / on-chain id); empty = any
            provider of this service type"
          type: string
        service_type:
          description: chatbot | text-to-image | image-editing | speech-to-text |
            embedding | decisions
          type: string
    internal_handler.RoutePreviewResponse:
      type: object
      properties:
        auto:
          description: >-
            Auto is present for model "0g/auto": the task the model was chosen
            for

            and the model chosen, whose providers are listed. [beta]
          allOf:
            - $ref: "#/components/schemas/internal_handler.RoutePreviewAutoResult"
          x-stability: beta
        encrypted_transit:
          description: >-
            EncryptedTransit is the request's effective end-to-end encryption

            requirement — the account's, API key's and X-0G-Encrypted-Transit's

            values merged (each level may only make it stricter than the one

