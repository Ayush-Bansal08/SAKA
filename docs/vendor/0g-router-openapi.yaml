  /models:
    get:
      description: >-
        Get all available AI models. By default the response is the **canonical
        view**: one row per `canonical_id`, with curated registry metadata and
        endpoints aggregated (max context, union of params/formats, cheapest
        pricing); `id` is the canonical model id. A model stays listed even when
        all its endpoints are temporarily unhealthy (health is not a visibility
        filter; routing falls back to unhealthy endpoints so a listed model is
        always routable). To enumerate the endpoints behind a canonical id, call
        `GET /v1/providers?canonical_id=<id>`. provider_address uses OR (match
        any), input_modality and supported_parameter use AND (must match all).

        `?legacy=true` returns the historical view keyed by the raw provider `model_id` (one row per on-chain model id, including ids not mapped to a registered canonical), for clients that have not migrated to canonical ids. This is a **listing-only** compatibility surface — routing remains canonical-only, so a raw id absent from the model registry is still `404 model_not_found` on the inference path. **[beta]**
      tags:
        - Models
      summary: Get model list
      parameters:
        - description: "[beta] true: historical raw-model_id-keyed view (listing-only; an
            unregistered id it lists is still 404 on the inference path).
            Default false: canonical view (id = canonical_id)."
          name: legacy
          in: query
          schema:
            type: boolean
        - description: "[beta] 'usd': emit the OpenRouter-standard shape with per-token
            USD decimal strings under the top-level `pricing` field (for
            external pricing aggregators, e.g. TKX); models without a USD price
            are omitted. Default: native prices under `pricing`, USD under
            `pricing_usd`."
          name: pricing
          in: query
          schema:
            type: string
            enum:
              - usd
        - description: "Filter by provider address (OR: match any)"
          name: provider_address
          in: query
          explode: true
          schema:
            type: array
            items:
              type: string
        - description: "Filter by input modality, e.g. text, image (AND: must support all)"
          name: input_modality
          in: query
          explode: true
          schema:
            type: array
            items:
              type: string
        - description: "Filter by supported parameter, e.g. temperature (AND: must support
            all)"
          name: supported_parameter
          in: query
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: Model list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ModelListR\
                  esponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
  /providers:
    get:
      description: 'Get all TEE-acknowledged providers, optionally narrowed by service
        type, on-chain model id, and/or canonical id. `model` and `canonical_id`
        are independent filters and compose (ANDed): `canonical_id` alone lists
        every endpoint of a canonical, while `model` + `canonical_id` narrows to
