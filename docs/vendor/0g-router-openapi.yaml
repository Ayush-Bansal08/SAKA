          description: Job status; on completion the result payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Request error. `malformed_job_id` means the id is shaped like one
            this endpoint issues but is not usable — resend it exactly as POST
            /videos returned it. An id issued before ids carried their provider
            can still report that it is tracked against more than one provider,
            where `provider_address` disambiguates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "403":
          description: Caller is not the submitter of this job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "404":
          description: async_job_not_found — this router has no such job id (it never
            existed, or it belongs to a different provider than the one pinned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "502":
