  /account/routing/explain:
    post:
      security:
        - ManagementKeyAuth: []
      description: "Shows how a request for `model` would be routed: every provider of
        the model, the routable ones first in the order a request tries them,
        then the excluded ones (this array order is guaranteed). Each routable
        one has a `route` (`primary`, then `fallback`; `not_used` when fallbacks
        are off; `skipped` when a retry passes over it because the same upstream
        — its `provider_identity`, else its address — already failed;
        `not_tried` past the retry budget) — providers equal on the sort key
        share a `tie_group`, across which routing spreads traffic, so their
        order within it is not a ranking and can change between calls — and for
        each excluded one every reason (`unhealthy`, `expired`, `not_capable`,
        `not_allowed`, `blocked`, `below_trust_mode`, `not_encryptable`,
        `over_price_cap`, `settlement_currency`, `not_billable`, `not_ranked`)
        with the rule `layer` that excluded it when a rule did. `outcome` says
        whether the request would be routed, and if not, the status and error
        code it would get. The account's routing rules apply, as `GET
        /v1/account/routing` returns them, or `account_routing` in their place
        (unsaved edits, validated as `PUT /v1/account/routing` validates them).
        With `api_key_id`, the rules of that key (one of the caller's inference
        keys) apply on top, a key's own value for a rule replacing the account's
        (a revoked or expired key's `outcome` is `401 invalid_api_key`, as a
        request with it gets); with `api_key_routing`, those rules apply instead
        of the saved ones (unsaved edits, or a key not created yet), validated
        as `PUT /v1/api-keys/{keyId}/routing` validates them. `rule_sources`
        names, for each rule set, whether the account's or the key's value
        applies; an exclusion's `layer` is `account`, `api_key` or `request`.
        `encrypted_transit` is the effective end-to-end encryption requirement
        (`off`, `preferred` — the default — or `required`); under `required`
        only providers a request can be sealed to are routable
        (`not_encryptable` excludes the rest). A preview model the caller is not
        listed for answers exactly like a model that does not exist (`404
        model_not_found`, no `canonical_id`, no providers). `api_format` picks
        the chat surface explained: `openai` (`/v1/chat/completions`, the
        default) or `anthropic` (`/v1/messages`); each routes only to providers
        of its own format. A failure to compute the explanation (a database
        error) is a `500`, not an `outcome`. Nothing is executed or billed, and
        no routing metrics are recorded. JWT, or a management key with
        `routing:read` (and `keys:read` to name an `api_key_id`). [beta]"
      tags:
        - Account
      summary: Explain routing under routing rules
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/internal_handler.AccountRoutingExplainRequest"
        description: Explain request
        required: true
      responses:
        "200":
          description: Routing explanation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/internal_handler.AccountRoutingExplainResponse"
        "400":
          description: Invalid request or rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "403":
          description: Missing scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "404":
          description: API key not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
