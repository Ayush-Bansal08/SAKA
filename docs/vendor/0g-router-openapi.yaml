                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "424":
          description: The video job failed at the provider and has no output
          content:
            application/octet-stream:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "429":
          description: Too many concurrent downloads for this account
          content:
            application/octet-stream:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "502":
          description: Upstream provider error
          content:
            application/octet-stream:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
  /web/search:
    post:
      security:
        - ApiKeyAuth: []
      description: >-
        Runs one web search and returns the results, for a client that executes
        a search tool itself: declare a `web_search` function tool, and when the
        model calls it, run its query here and send the results back as the tool
        result. This works with every model that supports tool calling,
        including end-to-end-encrypted ones, whose prompt the router cannot add
        search results to; only the query leaves the encrypted conversation.

        Billed at the per-search fee when results are returned (in 0G for 0G-settled accounts, converted at the router's current rate); a search with no results is free. Counts toward the inference rate limit. [beta]
      tags:
        - Inference
      summary: Search the web
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/internal_handler.WebSearchRequest"
        description: Search query
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/internal_handler.WebSearchResponse"
        "400":
          description: Missing or too long query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "402":
          description: Insufficient balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "423":
          description: Refund pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "502":
          description: The search backend failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "503":
          description: Search is not available right now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
  /webhooks:
    get:
      security:
        - ManagementKeyAuth: []
      description: The account's webhook endpoints (at most 5) with their subscribed
        events and delivery health. `status` is `healthy` (the last delivery
        succeeded), `failing` (it did not), `no_deliveries` (nothing sent yet)
        or `disabled` (deliveries failed for 3 days in a row; nothing more is
        sent — remove the endpoint and add it again). Secrets are never listed.
        JWT, or a management key with `webhooks:read`. See the webhooks guide
        for payloads and signature checks. [beta]
      tags:
        - Account
      summary: List webhook endpoints
      responses:
        "200":
          description: Endpoints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/internal_handler.WebhookListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "403":
          description: Missing webhooks:read scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
    post:
      security:
        - ManagementKeyAuth: []
      description: "Registers an https URL on a public host for the given events:
        `balance.low`, `model.added`, `model.removed`, `model.down`,
        `model.recovered` (at least one). `balance.low` is available to
        USD-billed accounts only (otherwise 400 `event_not_available`). The
        response carries the signing `secret` — the only time it is shown; store
        it. An account can have 5 endpoints (409 `webhook_limit_reached`). A URL
        that is not https, has credentials, or points at a private, loopback,
        link-local, CGNAT or metadata address → 400 `invalid_webhook`.
        Deliveries come from no fixed IP address: authenticate them by their
        signature. JWT, or a management key with `webhooks:write`. [beta]"
      tags:
        - Account
      summary: Create a webhook endpoint
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/internal_handler.CreateWebhookRequest"
        description: Endpoint
        required: true
      responses:
        "201":
          description: Created; secret shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/internal_handler.WebhookCreatedResponse"
        "400":
          description: Invalid URL or events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "403":
          description: Missing webhooks:write scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "409":
          description: Already 5 endpoints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
  "/webhooks/{id}":
    delete:
      security:
        - ManagementKeyAuth: []
      description: Removes the endpoint and its delivery history; deliveries not yet
        sent are dropped. JWT, or a management key with `webhooks:write`. [beta]
      tags:
        - Account
      summary: Delete a webhook endpoint
      parameters:
        - description: Endpoint id
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "403":
          description: Missing webhooks:write scope
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "404":
          description: No such endpoint
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "500":
          description: Server error
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
  "/webhooks/{id}/deliveries":
    get:
      security:
        - ManagementKeyAuth: []
      description: "The endpoint's deliveries from the last 30 days, newest first, 50
        per page; pass `next_before` as `before` for the next page. `status` is
        `pending` (more attempts to come, at `next_attempt_at`), `delivered` or
        `abandoned` (every attempt failed: retries run 1m, 5m, 30m, 2h, 6h and
        12h after the first). JWT, or a management key with `webhooks:read`.
        [beta]"
      tags:
        - Account
      summary: List webhook deliveries
      parameters:
        - description: Endpoint id
          name: id
          in: path
          required: true
          schema:
            type: integer
        - description: "Cursor: deliveries older than this id"
          name: before
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/internal_handler.WebhookDeliveryListResponse"
        "400":
          description: Invalid cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "403":
          description: Missing webhooks:read scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "404":
          description: No such endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
  "/webhooks/{id}/rotate-secret":
    post:
      security:
        - ManagementKeyAuth: []
      description: Returns a new signing secret — the only time it is shown. For 24
        hours deliveries carry two `v1=` signatures, one per secret, so a
        receiver can switch over without dropping events; after that only the
        new secret signs. JWT, or a management key with `webhooks:write`. [beta]
      tags:
        - Account
      summary: Rotate a webhook signing secret
      parameters:
        - description: Endpoint id
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: New secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/internal_handler.WebhookSecretResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "403":
          description: Missing webhooks:write scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "404":
          description: No such endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
  "/webhooks/{id}/test":
    post:
      security:
        - ManagementKeyAuth: []
      description: "Sends one sample event of the endpoint's first subscribed type,
        with `\"test\": true`, signed like any delivery, and answers with what
        the receiver did: `ok` (a 2xx within 10 seconds), its `status_code`
        (null if none arrived) and `error`. Not retried; a failing test does not
        count towards disabling the endpoint. One test per endpoint every 10
        seconds (429 `webhook_test_rate_limited`, with `Retry-After`). A failure
        to connect reads `destination not allowed`, `timed out` or `could not
        connect`. JWT, or a management key with `webhooks:write`. [beta]"
      tags:
        - Account
      summary: Send a test event
      parameters:
        - description: Endpoint id
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Receiver's answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_internal_service.Webhoo\
                  kTestResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "403":
          description: Missing webhooks:write scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "404":
          description: No such endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "429":
          description: Tested less than 10 seconds ago
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ErrorRespo\
                  nse"
tags: []
servers:
  - url: /v1
components:
  requestBodies:
    github_com_0glabs_0g-router_pkg_routingpolicy.Policy:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_routingpolicy.Polic\
              y"
      description: Routing rules
      required: true
    github_com_0glabs_0g-router_pkg_inference.ImageGenerationRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_inference.ImageGene\
              rationRequest"
      description: Image generation request
      required: true
  securitySchemes:
    ApiKeyAuth:
      description: 'API key for inference, file upload, and async image endpoints.
        Format: "Bearer sk-..."'
      type: apiKey
      name: Authorization
      in: header
    ManagementKeyAuth:
      description: 'Management key for account read and API key management.
        Capabilities are scope-limited per key (account:read, keys:read,
        keys:create, keys:manage). Format: "Bearer mk-..."'
      type: apiKey
      name: Authorization
      in: header
  schemas:
    github_com_0glabs_0g-router_internal_model.Broadcast:
      type: object
      properties:
        accounts:
          description: >-
            Accounts is every account at send time; Notified those whose bell
            got

            the entry (the rest turned the category's console channel off).
          type: integer
        body:
          type: string
        category:
          type: string
        created_at:
          type: string
        created_by:
          type: string
        forced:
          type: boolean
        id:
          type: integer
        link:
          type: string
        model:
          description: |-
            Subject is the model a new_models broadcast is about; Link the URL a
            news one points to.
          type: string
        notified:
          type: integer
        title:
          type: string
    github_com_0glabs_0g-router_internal_model.ModelIncident:
      type: object
      properties:
        announced_by:
          type: string
        created_at:
          type: string
        id:
          type: integer
        model:
          type: string
        notified:
          description: >-
            Notified / RecoveredNotified are how many bell entries each
            announcement

            wrote, for the on-call's record.
          type: integer
        recovered_notified:
          type: integer
        resolved_at:
          type: string
        resolved_by:
          type: string
        started_at:
          type: string
        status:
          type: string
    github_com_0glabs_0g-router_internal_model.ModelRemoval:
      type: object
      properties:
        cancelled_at:
          type: string
        cancelled_by:
          type: string
        created_at:
          type: string
        created_by:
          type: string
        id:
          type: integer
        last_notice_at:
          type: string
        model:
          type: string
        next_notice_at:
          type: string
        notices:
          description: >-
            Notices / Notified: how many notices went out, and how many bell
            entries

            they wrote in all.
          type: integer
        notified:
          type: integer
        removal_at:
          type: string
        replacement:
          type: string
        status:
          description: Status is scheduled, then removed (the last notice went out) or
            cancelled.
          type: string
        sudden:
          type: boolean
    github_com_0glabs_0g-router_internal_model.Notification:
      type: object
      properties:
        action:
          type: string
        body:
          type: string
        category:
          type: string
        created_at:
          type: string
        id:
          type: integer
        kind:
          type: string
        link:
          description: Link is the https URL a news broadcast points to (action open_link).
          type: string
        pinned:
          type: boolean
        read_at:
          type: string
        subject:
          description: >-
            Subject is what the entry is about when that is not the account
            itself:

            the model id for model-status entries ('' otherwise). The Console links

            "View status" with it.
          type: string
        title:
          type: string
    github_com_0glabs_0g-router_internal_service.AdminRoleView:
      type: object
      properties:
        created_at:
          type: string
        granted_by:
          type: string
        scopes:
          type: array
          items:
            type: string
        updated_at:
          type: string
        wallet_address:
          type: string
    github_com_0glabs_0g-router_internal_service.BroadcastPreview:
      type: object
      properties:
        accounts:
          type: integer
        category:
          type: string
        last_sent_at:
          description: |-
            LastSentAt is the category's last broadcast; for news, another one
            before LastSentAt + 7 days needs force.
          type: string
        recipients:
          type: integer
    github_com_0glabs_0g-router_internal_service.CreateProjectGrantRequest:
      type: object
      required:
        - owner_address
        - total_quota
      properties:
        currency:
          description: >-
            Currency selects the grant's unit and target ledger: "0g" (the
            default when

            omitted) or "usd". A "usd" grant requires features.usd_billing.
          type: string
        expires_at:
          description: RFC3339, "" = never
          type: string
        name:
          type: string
        owner_address:
          type: string
        total_quota:
          description: |-
            TotalQuota is a raw neuron integer for a 0g grant, or a USD decimal
            ("5", "1.50") for a usd grant (stored as micro-USD).
          type: string
    github_com_0glabs_0g-router_internal_service.DistributeProjectCreditRequest:
      type: object
      required:
        - amount
        - grant_id
        - idempotency_key
        - recipient_address
      properties:
        amount:
          type: string
        grant_id:
          type: string
        idempotency_key:
          type: string
        reason:
          type: string
        recipient_address:
          type: string
    github_com_0glabs_0g-router_internal_service.GrantCreditRequest:
      type: object
      required:
        - amount
        - type
        - user_address
      properties:
        amount:
          description: neuron (1 0G = 10^18 neuron)
          type: string
        reason:
          type: string
        type:
          description: '"welcome", "promotion", "compensation", "manual"'
          type: string
        user_address:
          type: string
    github_com_0glabs_0g-router_internal_service.GrantUsdCreditRequest:
      type: object
      required:
        - amount
        - type
        - user_address
      properties:
        amount:
          description: USD decimal, e.g. "5.00"
          type: string
        reason:
          type: string
        type:
          description: '"welcome", "promotion", "compensation", "manual"'
          type: string
        user_address:
          type: string
    github_com_0glabs_0g-router_internal_service.IncidentPreview:
      type: object
      properties:
        callers:
          description: |-
            Callers is every account that called the model in the window;
            Recipients those of them whose bell will get the entry.
          type: integer
        model:
          type: string
        recipients:
          type: integer
        window_days:
          type: integer
    github_com_0glabs_0g-router_internal_service.RemovalPreview:
      type: object
      properties:
        model:
          type: string
        recipients:
          description: |-
            Recipients is every account that called the model in the window; all
            of them get the notices (must-send).
          type: integer
        window_days:
          type: integer
    github_com_0glabs_0g-router_internal_service.RevokeUsdCreditRequest:
      type: object
      required:
        - reason
        - user_address
      properties:
        amount:
          description: USD decimal, e.g. "1.00"; omitted = all remaining
          type: string
          maxLength: 64
        reason:
          description: >-
            max=500 matches credit_grants.reason's varchar(500). Without the
            bound, a

            longer reason — a pasted clawback justification is plausible — fails the

            audit-row INSERT with MySQL 1406 under prod's STRICT_TRANS_TABLES. The

            transaction rolls back correctly, but classify-by-exclusion would file that

            permanent, caller-caused failure under ErrRevokeUnavailable → 503 "retry

            this one", and the batch would retry that account forever.
          type: string
          maxLength: 500
        user_address:
          type: string
    github_com_0glabs_0g-router_internal_service.UpdateAutoDepositRequest:
      type: object
      properties:
        enabled:
          type: boolean
        low_watermark:
          type: string
        max_balance:
          type: string
    github_com_0glabs_0g-router_internal_service.WebhookDeliveryView:
      type: object
      properties:
        attempts:
          type: integer
        created_at:
          type: string
        error:
          type: string
        event_id:
          type: string
        event_type:
          type: string
        id:
          type: integer
        last_attempt_at:
          type: string
        next_attempt_at:
          type: string
        status:
          description: Status is pending (more attempts to come), delivered or abandoned.
          type: string
        status_code:
          type: integer
        test:
          type: boolean
    github_com_0glabs_0g-router_internal_service.WebhookEndpointView:
      type: object
      properties:
        created_at:
          type: string
        disabled_at:
          type: string
        events:
          type: array
          items:
            type: string
          example:
            - balance.low
            - model.down
        id:
          type: integer
          example: 12
        last_delivery:
          $ref: "#/components/schemas/github_com_0glabs_0g-router_internal_service.Webhoo\
            kLastDelivery"
        previous_secret_expires_at:
          description: >-
            PreviousSecretExpiresAt is set during a rotation's grace window,
            while

            deliveries are also signed with the previous secret.
          type: string
        status:
          description: |-
            Status is healthy (last delivery succeeded), failing (it did not),
            no_deliveries (nothing sent yet) or disabled (failed for 3 days; no
            longer delivered to).
          type: string
          example: healthy
        url:
          type: string
          example: https://example.com/hooks/0g
    github_com_0glabs_0g-router_internal_service.WebhookLastDelivery:
      type: object
      properties:
        at:
          type: string
        error:
          type: string
        ok:
          type: boolean
        status_code:
          description: StatusCode is the receiver's HTTP status; null when no response
            arrived.
          type: integer
    github_com_0glabs_0g-router_internal_service.WebhookTestResult:
      type: object
      properties:
        error:
          type: string
        event_id:
          type: string
          example: evt_4f1c2a9b0d3e5f6a7b8c9d0e
        ok:
          type: boolean
        status_code:
          type: integer
        type:
          type: string
          example: balance.low
