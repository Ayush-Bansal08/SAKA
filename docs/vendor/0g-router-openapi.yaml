  /async/images/edits:
    post:
      security:
        - ApiKeyAuth: []
      description: >-
        Submit an image editing job to be processed asynchronously. The response
        includes `jobId` and `provider_address` — clients then poll
        `/v1/async/jobs/{jobId}` with `?provider_address=...` to retrieve the
        result.

        Supports provider routing preferences via `X-0G-Provider-*` request headers (`Address`, `Sort`, `Trust-Mode`, `Allow-Fallbacks`). Multipart endpoints have no body-side routing surface — headers only.
      tags:
        - Inference
      summary: Submit async image edit job
      parameters:
        - description: "Routing: pin to a specific provider by on-chain address
            (0x-prefixed)."
          name: X-0G-Provider-Address
          in: header
          schema:
            type: string
        - description: "Routing: provider sort strategy. `latency` | `price`."
          name: X-0G-Provider-Sort
          in: header
          schema:
            type: string
        - description: "Routing: trust tier filter (`verified` | `private`). `verified` is
            a floor — `private` providers also satisfy it."
          name: X-0G-Provider-Trust-Mode
          in: header
          schema:
            type: string
        - description: "Routing: whether to retry on other providers after a failure.
            `true` | `false`. Defaults to false when an address is pinned, true
            otherwise."
          name: X-0G-Provider-Allow-Fallbacks
          in: header
          schema:
            type: string
        - description: "Routing: only these providers, comma-separated: `0x…` (every
            upstream behind that address), `0x…/identity` (one upstream behind
            it) or `*/identity` (that upstream behind every address). Combines
            with the API key's own allowed providers: a provider must be on
            both. [beta]"
          name: X-0G-Provider-Allow
          in: header
          schema:
            type: string
        - description: "Routing: never these providers, same forms as X-0G-Provider-Allow.
            Adds to the API key's own blocked providers. [beta]"
          name: X-0G-Provider-Block
          in: header
          schema:
            type: string
      responses:
        "202":
          description: Job submitted; response carries jobId, status, provider_address
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Request error
          content:
            application/json:
              schema:
