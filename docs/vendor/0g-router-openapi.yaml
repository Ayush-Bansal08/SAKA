    internal_handler.WebhookListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/github_com_0glabs_0g-router_internal_service.Webhoo\
              kEndpointView"
    internal_handler.WebhookSecretResponse:
      type: object
      properties:
        previous_secret_expires_at:
          description: >-
            PreviousSecretExpiresAt: until then deliveries are also signed with
            the

            previous secret.
          type: string
        secret:
          type: string
          example: whsec_9b1f…
    internal_handler.batchGrantRequest:
      type: object
      required:
        - grants
      properties:
        grants:
          type: array
          maxItems: 100
          minItems: 1
          items:
            $ref: "#/components/schemas/github_com_0glabs_0g-router_internal_service.GrantC\
              reditRequest"
    internal_handler.channelPatch:
      type: object
      properties:
        console:
          type: boolean
        email:
          type: boolean
    internal_handler.createAdminScopedKeyRequest:
      type: object
      required:
        - name
        - scopes
      properties:
        expiration:
          description: |-
            Expiration is optional: RFC3339 (e.g. 2026-12-31T23:59:59+08:00) or
            "no_expiration"/empty for a non-expiring key. Same grammar as
            ParseExpiration elsewhere.
          type: string
        name:
          type: string
        rate_limit_rpm:
          description: >-
            RateLimitRPM optionally caps this key at N requests per minute
            across

            the admin endpoints it can reach; omitted/null = no per-key cap. Must be

            ≥ 1 when set (400 invalid_rate_limit otherwise).
          type: integer
          example: 30
        scopes:
          description: admin-only scopes, e.g. ["usage:read"]
          type: array
          minItems: 1
          items:
            type: string
    internal_handler.putAdminRoleRequest:
      type: object
      properties:
        scopes:
          type: array
          items:
            type: string
    internal_handler.setSettlementModeRequest:
      type: object
      properties:
        mode:
          description: '"0g" or "usd"'
          type: string
          example: usd
    internal_handler.stripeCheckoutRequest:
      type: object
      required:
        - amount_micro
        - success_url
      properties:
        amount_micro:
          type: string
        cancel_url:
          type: string
        email:
          description: >-
            Email (optional) → Stripe customer_email: prefills the email field +
            gets

            the receipt. Not persisted server-side.
          type: string
        success_url:
          description: >-
            SuccessURL (required) / CancelURL (optional) → the browser return
            targets.

            The frontend owns the path (e.g. its locale prefix); the backend validates

            only the origin against auth.allowed_origins. There is no server-side

            default — success_url must be supplied on every request.
          type: string
    internal_handler.updateProjectGrantRequest:
      type: object
      required:
        - status
      properties:
        status:
          description: '"active" | "paused"'
          type: string
