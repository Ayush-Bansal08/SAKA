        status:
          type: integer
          example: 403
    internal_handler.AccountRoutingExplainProvider:
      type: object
      properties:
        address:
          type: string
          example: "0x1234567890abcdef"
        architecture:
          $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ModelArchi\
            tecture"
        canonical_id:
          description: "[beta] Canonical model id this endpoint serves; empty if unmapped"
          type: string
          x-stability: beta
          example: glm-5.1
        context_length:
          type: integer
        default_parameters:
          type: object
          additionalProperties: {}
        exclusions:
          description: |-
            Exclusions lists why an excluded provider is excluded, every reason
            that applies, the one routing meets first first.
          type: array
          items:
            $ref: "#/components/schemas/internal_handler.AccountRoutingExplainExclusion"
        expiration_date:
          description: Upstream model availability expiration (RFC3339); empty = no
            expiration. Only visible before the instant — an expired endpoint
            drops out of this listing entirely.
          type: string
        is_healthy:
          description: nil=unknown, true=healthy, false=unhealthy
          type: boolean
          example: true
        latency:
          description: nil=no health data
          type: integer
          example: 150
        max_completion_tokens:
          type: integer
        model_id:
          type: string
          example: qwen-2.5-7b-instruct
        name:
          description: Model metadata (populated when listing providers for a specific
            model)
          type: string
        pricing:
          $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ModelPrici\
            ng"
        pricing_usd:
          description: Per-token USD prices; only set when upstream metadata provides them
          allOf:
            - $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_response.ModelPrici\
                ng"
        provider_country:
          description: "[beta] Operator-declared serving country/locality"
          type: string
          x-stability: beta
        provider_identity:
          description: >-
            ProviderIdentity distinguishes two same-model candidates served by
            one

            broker (same address) via different upstreams (e.g. glm-5.2 via aliyun vs

            zhipu). Empty (omitted) for a legacy single-upstream endpoint, so the two

            rows for one address+model are otherwise indistinguishable without it.
          type: string
          x-stability: beta
          example: aliyun
        provider_name:
          description: >-
            Operator-declared, descriptive endpoint identity/locality (from the

            broker's /models metadata). Empty when the operator did not declare them.
          type: string
          x-stability: beta
        route:
          description: |-
            Route: primary | fallback | not_used (routable, but fallbacks are
            off) | skipped (a retry passes it over: the same upstream — its
            provider_identity, or its whole address when it has none — already
            failed in an earlier attempt) | not_tried (past the retry budget, or
            the request fails before routing) | excluded.
          type: string
          example: fallback
        service_type:
          type: string
          example: chatbot
        serving_domain:
          description: "[beta] Operator-declared serving domain. Present only on
            `verified` / `private` endpoints; never on `standard`"
          type: string
          x-stability: beta
        supported_formats:
          type: array
          items:
            type: string
        supported_parameters:
          type: array
          items:
            type: string
        tee_acknowledged:
          type: boolean
          example: true
        tee_attested:
          type: boolean
        tee_type:
          type: string
        tee_verifier:
          type: string
        tie_group:
          description: >-
            TieGroup numbers, from 1 in order, the routable providers that are
            equal

            on the sort's key (price, latency, or failure count for the default

            ranking). Routing spreads traffic across a group, so within one the

            order, and with it which member shows as primary or as which fallback,

            is not a ranking and can change from one call to the next. Suggested

            display: a group of one as "Primary" or "Fallback N" (N counted along

            the array); a larger group as a whole, "shares traffic · attempts k–m".

            Absent for an excluded provider.
          type: integer
          example: 1
        trust_mode:
          description: "[beta] Routable trust tier of this endpoint: standard | verified |
            private. Derived from provider_type — the authoritative tier signal
            (verifiability is a descriptive TEE label and is empty for
            standard). Use this to match a request's provider.trust_mode /
            X-0G-Provider-Trust-Mode floor. ABSENT when the endpoint registered
            a tier signal the router has no mapping for: read that as \"not
            classified\" rather than substituting a tier, and note such an
            endpoint is not selected by any trust-mode request (it still serves
            requests that ask for no tier)."
          type: string
          x-stability: beta
        type:
          type: string
        uptime:
          description: nil=no health data
          type: number
          example: 99.5
        verifiability:
          type: string
    internal_handler.AccountRoutingExplainRequest:
      type: object
      properties:
        account_routing:
          description: >-
            AccountRouting previews these account rules instead of the saved
            ones

            (unsaved edits on the Routing page). Same shape and validation as PUT

            /v1/account/routing.
          allOf:
            - $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_routingpolicy.Polic\
                y"
        api_format:
          description: >-
            APIFormat is the chatbot surface explained: openai

            (/v1/chat/completions, the default) | anthropic (/v1/messages). Each

            endpoint routes only to providers of its own format, so there is no

            "either": a preview mixing both would rank providers no request uses.
          type: string
          example: openai
        api_key_id:
          description: |-
            APIKeyID previews the routing of requests made with this key (one of
            the caller's own inference keys), under its saved rules.
          type: string
          example: 3f2a6c1e-8d4b-4f0a-9c7e-1b2d3e4f5a6b
        api_key_routing:
          description: >-
            APIKeyRouting previews these key rules instead of the saved ones —

            unsaved edits in the key dialog, or a key not created yet (without

            api_key_id). Same shape and validation as PUT /v1/api-keys/{keyId}/routing.
          allOf:
            - $ref: "#/components/schemas/github_com_0glabs_0g-router_pkg_routingpolicy.Polic\
                y"
        model:
          description: "Model is required: any name the router accepts (canonical id or
            alias)."
          type: string
          example: glm-5.3
        service_type:
          description: ServiceType defaults to chatbot. Same vocabulary as
            /v1/routing/preview.
          type: string
          example: chatbot
    internal_handler.AccountRoutingExplainResponse:
      type: object
      properties:
        allow_fallbacks:
          type: boolean
          example: true
        canonical_id:
          type: string
          example: glm-5.3
        encrypted_transit:
          description: >-
            EncryptedTransit is the effective end-to-end encryption requirement:

            off | preferred (the default) | required. Under required only

            providers a request can be sealed to are routable, and a request that

            is not end-to-end encrypted is refused.
          type: string
          example: preferred
        max_attempts:
          description: MaxAttempts is how many providers a request tries at most.
          type: integer
          example: 4
        model:
          type: string
          example: glm-5.3
        object:
          type: string
          example: routing.explanation
        outcome:
          $ref: "#/components/schemas/internal_handler.AccountRoutingExplainOutcome"
        providers:
          description: |-
            Providers are the routable rows first, in the order a request tries
            them, then the excluded rows. The order is part of the contract.
          type: array
          items:
            $ref: "#/components/schemas/internal_handler.AccountRoutingExplainProvider"
        routable:
          description: |-
            Routable is how many providers a request could use (0 when the
            request is refused).
          type: integer
          example: 4
        rule_sources:
          description: >-
            RuleSources names, for each rule the account or the API key sets,
            the

            level whose value applies: account | api_key (a key's own value

            replaces the account's). Keys are the routing policy's field names,

            max_price_usd's dimensions one by one (max_price_usd.prompt, …).
          type: object
          additionalProperties:
            type: string
          example:
            sort: api_key
            trust_mode: account
        service_type:
          type: string
          example: chatbot
        settlement:
          description: |-
            Settlement is the account's settlement currency, which decides price
            ordering and which providers can bill it: 0g | usd.
          type: string
          example: 0g
        sort:
          description: >-
            Sort is the effective provider order: price | latency | default (the

            router's health-aware ranking: fewest recent failures, then latency).
          type: string
          example: price
        total:
          description: >-
            Total is every acknowledged provider row of the model, not paged:
            the

            length of Providers.
          type: integer
          example: 6
