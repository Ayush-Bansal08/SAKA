    put:
      security:
        - ManagementKeyAuth: []
      description: "Replaces the account's routing rules with the body: a field left
        out or `null` is cleared. Unknown fields are rejected. `sort` is `price`
        or `latency`; `trust_mode` is `standard`, `verified` or `private`;
        `encrypted_transit` is `off`, `preferred` or `required`. Models are
        canonical model ids. A provider is `{\"address\": \"0x…\"}` (every
        upstream behind that address), `{\"address\": \"0x…\", \"identity\":
        \"aliyun\"}` (one upstream behind it) or `{\"identity\": \"aliyun\"}`
        (that upstream behind every address). An allowed list must not be empty
        (use `null` for no restriction); an empty blocked list is the same as
        `null`. `max_price_usd` takes USD per 1M prompt tokens, USD per 1M
        completion tokens and USD per image; `0` admits only providers priced at
        $0. A provider no listing currently matches is saved, with a `warnings`
        entry (`unknown_provider`); a rule some of the account's active API keys
        replace with their own value is saved with an `overridden_by_keys`
        warning naming how many. Saved rules apply to new requests within about
        30 seconds. Invalid input → 400 `invalid_routing_policy`. JWT, or a
        management key with `routing:write`. [beta]"
