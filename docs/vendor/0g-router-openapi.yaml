        response includes `jobId` and `provider_address` — clients then poll
        `/v1/async/jobs/{jobId}` with `?provider_address=...` to retrieve the
        result.

        **Provider Routing**: Use `"provider": {...}` body field OR `X-0G-Provider-*` request headers. Header > body precedence resolves same-field conflicts.

        **End-to-end encryption** [beta]: a 0G Private Computer client may seal `prompt` into a top-level `_e2ee` object and omit the cleartext `prompt`. The completed poll response is then sealed too: `data` is encrypted to the client and `usage.output_images` (cleartext) is the billed count. A sealed body must not also carry a top-level `prompt` (`400 invalid_request`) or `plugins`/`attachments` (`400 unsupported_with_e2ee`); a sealed result without a usable `usage.output_images` is refused with `502 invalid_sealed_response` and not charged.
      tags:
        - Inference
      summary: Submit async image generation job
      parameters:
        - description: "Routing: pin to a specific provider by on-chain address
            (0x-prefixed)."
          name: X-0G-Provider-Address
          in: header
          schema:
            type: string
        - description: "Routing: provider sort strategy. `latency` | `price`."
          name: X-0G-Provider-Sort
          in: header
          schema:
            type: string
        - description: "Routing: trust tier filter (`verified` | `private`). `verified` is
            a floor — `private` providers also satisfy it."
          name: X-0G-Provider-Trust-Mode
          in: header
          schema:
            type: string
        - description: "Routing: whether to retry on other providers after a failure.
            `true` | `false`. Defaults to false when an address is pinned, true
            otherwise."
          name: X-0G-Provider-Allow-Fallbacks
          in: header
          schema:
            type: string
        - description: "Routing: only these providers, comma-separated: `0x…` (every
            upstream behind that address), `0x…/identity` (one upstream behind
            it) or `*/identity` (that upstream behind every address). Combines
            with the API key's own allowed providers: a provider must be on
            both. [beta]"
          name: X-0G-Provider-Allow
